# CodeBuild — Build stage for the career-api pipeline.
# Builds the Docker image, pushes it to ECR (SHA-tagged), and hands the
# image URI to the Deploy stage via image_uri.txt. Mirrors the root
# buildspec.yml but targets apps/career-api/Dockerfile.
#
# Injected by Terraform (packages/terraform-aws/career_cicd.tf):
#   ECR_REPO_URI        career-api ECR repo
#   AWS_DEFAULT_REGION
#   BASE_BUN_REPO       shared ECR mirror of oven/bun base images

version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"
      - export COMMIT_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_URI="$ECR_REPO_URI:$COMMIT_SHA"
      - echo "Image tag $IMAGE_URI"

  build:
    commands:
      - echo "Building image..."
      - docker build
          --build-arg BUN_BUILDER_IMAGE="$BASE_BUN_REPO:1.3.1"
          --build-arg BUN_RUNNER_IMAGE="$BASE_BUN_REPO:1.3.1-slim"
          -f apps/career-api/Dockerfile
          -t "$IMAGE_URI"
          .

  post_build:
    commands:
      - echo "Pushing image..."
      - docker push "$IMAGE_URI"
      - echo "$IMAGE_URI" > image_uri.txt
      - cat image_uri.txt

artifacts:
  files:
    - image_uri.txt
