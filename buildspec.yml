# CodeBuild instructions for the **Build** stage of the API pipeline.
# Responsibility: build the Docker image, push it to ECR (SHA-tagged), and
# hand the resulting image URI off to the Deploy stage via an artifact.
#
# The Deploy stage (deployspec.yml) renders the task definition and rolls
# the service. Build never touches ECS.
#
# Inputs (injected by Terraform via CodeBuild env vars):
#   ECR_REPO_URI         e.g. 966805055435.dkr.ecr.us-east-1.amazonaws.com/hirely-prod-api
#   AWS_DEFAULT_REGION   e.g. us-east-1
#   BASE_BUN_REPO        ECR mirror of oven/bun base images
#
# Output artifact:
#   image_uri.txt        single line with the SHA-tagged image URI

version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"
      - export COMMIT_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_URI="$ECR_REPO_URI:$COMMIT_SHA"
      - echo "Image tag $IMAGE_URI"

  build:
    commands:
      - echo "Building image..."
      - docker build
          --build-arg BUN_BUILDER_IMAGE="$BASE_BUN_REPO:1.3.1"
          --build-arg BUN_RUNNER_IMAGE="$BASE_BUN_REPO:1.3.1-slim"
          -f apps/api/Dockerfile
          -t "$IMAGE_URI"
          .

  post_build:
    commands:
      - echo "Pushing image..."
      - docker push "$IMAGE_URI"
      - echo "$IMAGE_URI" > image_uri.txt
      - cat image_uri.txt

artifacts:
  files:
    - image_uri.txt
