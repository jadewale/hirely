# Local development dependencies for the career-platform app.
#
#   docker compose up -d career-postgres
#
# Exposes Postgres on host port 5444. Override with CAREER_PG_PORT if it's busy.
# Point apps/career-api/.env at it (use 127.0.0.1, not localhost, to avoid IPv6
# resolution issues on macOS):
#   DATABASE_URL=postgres://career:career@127.0.0.1:5444/career
services:
  career-postgres:
    image: postgres:16
    container_name: career-postgres
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: career
    ports:
      - "${CAREER_PG_PORT:-5444}:5432"
    volumes:
      - career-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  career-pgdata:
